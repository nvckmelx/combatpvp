# Чертёж для Render (https://render.com/docs/blueprint-spec):
# один веб-сервис раздаёт собранный клиент и WebSocket /ws.
services:
  - type: web
    name: hujarilovo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
